---
- name: Sync system clock from control machine
  shell: "date -u -s '{{ now(utc=True, fmt='%Y-%m-%dT%H:%M:%SZ') }}'"
  ignore_errors: true

- name: Ensure raspi.list uses trusted flag on Trixie (SHA1 key workaround)
  copy:
    content: "deb [trusted=yes] http://archive.raspberrypi.org/debian/ trixie main\n"
    dest: /etc/apt/sources.list.d/raspi.list
  when: ansible_distribution_major_version == '13'

# Trixie's apt verifies repo signatures with Sequoia (sqv), whose default policy
# rejects the Raspberry Pi archive key from 2026-02-01 because its self-signature
# uses SHA1 ("second pre-image resistance"). python-apt (used by the apt module)
# treats this as a hard fetch failure even with [trusted=yes], so relax the
# policy to accept SHA1. Created unconditionally so it is already in place once
# a fresh Bookworm host is dist-upgraded to Trixie.
- name: Ensure sequoia crypto-policy directory exists (SHA1 key workaround)
  file:
    path: /etc/crypto-policies/back-ends
    state: directory
    mode: '0755'

- name: Relax Sequoia crypto policy to accept SHA1-signed repo key (SHA1 key workaround)
  copy:
    content: |
      [hash_algorithms.sha1]
      collision_resistance = "always"
      second_preimage_resistance = "always"
    dest: /etc/crypto-policies/back-ends/sequoia.config
    mode: '0644'

- name: Update apt cache
  apt:
    update_cache: yes
    force_apt_get: yes

- name: Fix any broken packages
  apt:
    state: fixed
    force_apt_get: yes
  ignore_errors: true

- name: Install chrony
  apt:
    name: chrony
    state: present
    force_apt_get: yes
  register: chrony_install
  until: chrony_install is success
  retries: 5
  delay: 15

- name: Enable and start chrony
  systemd:
    name: chrony
    enabled: yes
    state: started

- name: Install vim and byobu
  apt:
    name:
      - vim
      - byobu
    state: present
    update_cache: yes
    force_apt_get: yes
  register: vim_byobu_install
  until: vim_byobu_install is success
  retries: 5
  delay: 15

- name: Enable byobu for root
  command: byobu-enable
  args:
    creates: /root/.byobu
